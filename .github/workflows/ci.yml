name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # The full suite is intentionally run one interpreter at a time.  Keeping
      # the matrix from fanning out avoids multiplying its memory footprint on
      # constrained runners.
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest

  # the c0 native-recompile back end across platforms and compilers
  # (graduation plan phase 4); the decoder suite is platform-independent
  # and already covered by `test` above
  c0:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    # the Windows lane (MinGW-w64 gcc) is experimental until proven green
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      CC: ${{ matrix.cc }}
      # test_c0.py is parked behind TBX_C0 for local runs (decoder-campaign
      # friction); CI still runs it so the platform matrix keeps its signal
      TBX_C0: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        # SDL2 so the headless SDL backend test runs instead of skipping
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - if: runner.os == 'macOS'
        run: brew install sdl2
      - run: uv sync --locked
      - run: uv run pytest tests/tbx/test_c0.py -q
