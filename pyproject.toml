[project]
name = "tbx"
version = "0.1.0"
description = "Byte-exact decompiler for Borland Turbo Basic 1.0/1.1 MS-DOS executables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/leag/tbx"

[project.optional-dependencies]
# Disassembly-based debugging tools (tbx.tools.cfgview and friends); the
# core decompile pipeline needs no third-party packages.
debug = [
    "iced-x86>=1.21.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
tbx = "tbx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tbx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
# Standalone debugging scripts that extend sys.path before importing the package.
"tbx/tools/*.py" = ["E402"]
# importorskip must run before importing tbx.tools.cfg (needs the `debug` extra).
"tests/tbx/test_cfg.py" = ["E402"]
# Package facades re-export their submodules' public surface.
"tbx/ir/__init__.py" = ["F401"]
"tbx/decode0/__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "iced-x86>=1.21.0",
    "lizard>=1.17.10",
    "pytest>=9.0.0",
    "radon>=5.1,<5.2",
    "ruff>=0.15.0",
    "wily>=1.25.0",
    "xenon>=0.9.3",
]
